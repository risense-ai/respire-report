[package]
name = "agentnotify-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.150"
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.42", features = ["serde"] }
schemars = { version = "=1.0.4", features = ["chrono04", "uuid1"] }
ts-rs = { version = "=11.0.1", features = ["chrono-impl", "uuid-impl", "no-serde-warnings"] }
tempfile = "=3.27.0"

zeroize = "=1.9.1"

rusqlite = { version = "=0.32.1", features = ["bundled", "backup"] }

chrono-tz = "=0.10.4"
sha2 = "=0.10.9"

aes-gcm = "=0.10.3"
ring = "=0.17.14"
base64 = "=0.22.1"
url = "=2.5.8"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "=1.0.10"
pulldown-cmark = { version = "=0.13.6", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
rcgen = { version = "=0.14.5", default-features = false, features = ["crypto", "ring"] }
